name: 每日更新并发布

# 每天 01:30 UTC（北京时间 09:30）自动：
#   1. 抓取最新 AI 动态 / X 资料 / GitHub 榜单
#   2. 生成中文对照
#   3. 重建 index.html（单文件页面）
#   4. 把结果提交回仓库，并发布到 GitHub Pages
# 也支持在 Actions 页面手动点 “Run workflow”。

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      commit_data:
        description: "是否把更新后的数据提交回仓库（默认否：只发布页面，避免仓库每天增长约 9MB）"
        type: boolean
        default: false

permissions:
  contents: write      # 提交更新后的数据
  pages: write         # 发布 Pages
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取 AI 厂商动态
        run: python scripts/fetch_ai_news.py

      - name: 抓取 X 领军人物 / 官方账号资料
        run: python scripts/fetch_x.py

      - name: 刷新 GitHub 榜单（带 Token，额度更高）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE=1 ./scripts/collect.sh
          python scripts/merge.py
          python scripts/fetch_readmes.py

      - name: 生成中文对照（走缓存，只翻新增内容）
        run: python scripts/translate_data.py

      - name: 构建单文件页面
        run: python scripts/build.py

      - name: 自测（不通过则发布失败）
        run: |
          python scripts/test_tweet_parse.py
          node scripts/smoke.js

      # 默认不提交：每日发布只需要产物，提交会把 9MB 数据写进历史，一年膨胀数 GB。
      # 想给仓库留一份数据快照时，手动运行并勾选 commit_data。
      - name: 提交更新（仅在手动勾选时执行）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_data }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 准备 Pages 产物
        run: |
          mkdir -p _site
          cp index.html favicon.svg _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
